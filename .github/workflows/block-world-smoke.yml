name: Block World smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'block-world.html'
      - 'block-world-3d.html'
      - 'block-world-3d.js'
      - 'block-world-3d-textures.js'
      - 'block-world-3d.css'
      - 'block-world-3d-next.css'
      - 'block-world-3d-premium.css'
      - 'tests/block-world-3d-smoke.cjs'
      - 'block-world.js'
      - 'block-world-coop.js'
      - 'block-world-art.js'
      - 'block-world-art-forest.js'
      - 'block-world-ui.js'
      - 'block-world-premium.css'
      - 'block-world-premium-forest.css'
      - 'tests/block-world-coop-smoke.cjs'
      - 'tests/block-world-browser-performance.cjs'
      - 'block-world.css'
      - 'tests/block-world-smoke.cjs'
      - '.github/workflows/block-world-smoke.yml'
  pull_request:
    paths:
      - 'block-world.html'
      - 'block-world-3d.html'
      - 'block-world-3d.js'
      - 'block-world-3d-textures.js'
      - 'block-world-3d.css'
      - 'block-world-3d-next.css'
      - 'block-world-3d-premium.css'
      - 'tests/block-world-3d-smoke.cjs'
      - 'block-world.js'
      - 'block-world-coop.js'
      - 'block-world-art.js'
      - 'block-world-art-forest.js'
      - 'block-world-ui.js'
      - 'block-world-premium.css'
      - 'block-world-premium-forest.css'
      - 'tests/block-world-coop-smoke.cjs'
      - 'block-world.css'
      - 'tests/block-world-smoke.cjs'
      - '.github/workflows/block-world-smoke.yml'
  workflow_dispatch:
jobs:
  block-world:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Block World
        run: |
          node tests/block-world-smoke.cjs
          node tests/block-world-coop-smoke.cjs
          node tests/block-world-3d-smoke.cjs

  browser-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser engines
        run: |
          npm ci --prefix prime --no-audit --no-fund
          npm exec --prefix prime -- playwright install --with-deps chromium webkit
      - name: Benchmark Block World mobile browser emulation
        run: node tests/block-world-browser-performance.cjs
      - name: Save browser performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block-world-browser-performance
          path: artifacts/block-world-browser-performance.json
          if-no-files-found: warn
