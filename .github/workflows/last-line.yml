name: Last Line smoke
on: [pull_request, push]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check last-line/game-3d.js && node --check last-line/simulation.js && node --check last-line/game.js && node tests/last-line-smoke.cjs
