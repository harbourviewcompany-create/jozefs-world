name: Publish Jozef's World
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js for game regression tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify identical published homepage and world entrypoints
        run: |
          cmp -s index.html world.html || { echo "::error::index.html and world.html have diverged. Synchronize both before publishing."; exit 1; }
      - name: Verify production bundles match their sources
        run: |
          node scripts/build-arena-bundle.cjs --check
          node scripts/build-site-css.cjs --check
          node scripts/build-site-js.cjs --check
      - name: Validate interactive games before publishing
        run: node --test tests/*.test.cjs
      - name: Build PRIME ARENA (Phaser 4, TypeScript 7, Vite 8)
        run: |
          npm ci --prefix prime --no-audit --no-fund
          npm run check --prefix prime
          npm run test --prefix prime
          npm run build --prefix prime
          test -s prime/dist/index.html || { echo "::error::Prime Arena bundle missing"; exit 1; }
          test -s prime/dist/neon.html || { echo "::error::Neon City bundle missing"; exit 1; }
      - name: Verify Prime mobile play, deep links and offline reload before publishing
        run: |
          npm exec --prefix prime -- playwright install --with-deps chromium webkit
          node tests/prime-mobile-smoke.cjs
          node tests/neon-mobile-smoke.cjs
      - name: Gate publishing on Arena, HQ and Versus mobile browser checks
        run: |
          npm install --no-save playwright@1.56.1
          node tests/arena-mobile-smoke.cjs
          node tests/hq-mobile-smoke.cjs
          node tests/versus-mobile-smoke.cjs
          node tests/adventure-mobile-smoke.cjs
      - name: Stage root site and compiled Prime Arena
        run: |
          mkdir -p _site/prime
          rsync -a --exclude '.git' --exclude '_site' --exclude 'prime' \
            --exclude '.github' --exclude 'tests' --exclude 'scripts' ./ _site/
          cp -R prime/dist/. _site/prime/
          test -s _site/prime/index.html
          test -s _site/prime/neon.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
