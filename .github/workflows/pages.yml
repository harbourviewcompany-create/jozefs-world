name: Publish Jozef's World
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js for game regression tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify identical published homepage and world entrypoints
        run: |
          cmp -s index.html world.html || { echo "::error::index.html and world.html have diverged. Synchronize both before publishing."; exit 1; }
      - name: Verify production bundles match their sources
        run: |
          node scripts/build-arena-bundle.cjs --check
          node scripts/build-site-css.cjs --check
          node scripts/build-site-js.cjs --check
      - name: Validate interactive games before publishing
        run: node --test tests/*.test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
