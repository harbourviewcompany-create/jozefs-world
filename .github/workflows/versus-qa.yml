name: Versus multiplayer and mobile QA
on:
  push:
    branches: [main]
    paths:
      - 'versus-modes-2026.js'
      - 'versus-experience-2026.js'
      - 'tests/versus-modes-2026.test.cjs'
      - 'versus.js'
      - 'versus-physics.js'
      - 'versus-2026.css'
      - 'versus-visual-2026.js'
      - 'ui-refine-2026.css'
      - 'site-experience.css'
      - 'tests/versus-2026-visual.test.cjs'
      - 'index.html'
      - 'world.html'
      - 'tests/versus-mobile-smoke.cjs'
      - '.github/workflows/versus-qa.yml'
  pull_request:
    paths:
      - 'versus-modes-2026.js'
      - 'versus-experience-2026.js'
      - 'tests/versus-modes-2026.test.cjs'
      - 'versus.js'
      - 'versus-physics.js'
      - 'versus-2026.css'
      - 'versus-visual-2026.js'
      - 'ui-refine-2026.css'
      - 'site-experience.css'
      - 'tests/versus-2026-visual.test.cjs'
      - 'index.html'
      - 'world.html'
      - 'tests/versus-mobile-smoke.cjs'
      - '.github/workflows/versus-qa.yml'
  workflow_dispatch:
concurrency:
  group: versus-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-multiplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and site consistency
        run: |
          node --check versus.js
          node --check versus-modes-2026.js
          node --check versus-experience-2026.js
          node --test tests/versus-modes-2026.test.cjs
          node --check versus-visual-2026.js
          node --check tests/versus-mobile-smoke.cjs
          node --test tests/versus-2026-visual.test.cjs
          node scripts/build-site-css.cjs --check
          cmp -s index.html world.html
      - name: Install browsers
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Dad and Jozef multiplayer, co-op and phone layouts
        env:
          VERSUS_SCREENSHOTS: qa-shots
        run: |
          mkdir -p qa-shots
          node tests/versus-mobile-smoke.cjs
      - name: Retain portrait and landscape screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: versus-mobile-screenshots
          path: qa-shots/*.png
          if-no-files-found: ignore
          retention-days: 7
