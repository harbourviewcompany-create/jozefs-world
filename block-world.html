<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Daddy & Jozef's Minecraft World</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; overflow: hidden; background: #87CEEB; height: 100%; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
#ui { position: fixed; top: 6px; left: 6px; background: rgba(0,0,0,0.6); color: #fff; padding: 6px 8px; border-radius: 6px; z-index: 10; font-family: monospace; font-size: 10px; max-width: 200px; border: 1px solid #444; }
#ui h2 { margin: 0 0 4px 0; font-size: 12px; }
#ui p { margin: 1px 0; }
.hotbar { position: fixed; bottom: 4px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; background: rgba(0,0,0,0.55); padding: 3px; border: 2px solid #333; border-radius: 4px; z-index: 10; max-width: 92vw; overflow-x: auto; }
.slot { width: 36px; height: 36px; border: 2px solid #444; background: rgba(40,40,40,0.8); position: relative; flex-shrink: 0; border-radius: 2px; }
.slot.selected { border-color: #ff5; background: rgba(60,60,60,0.9); }
.slot canvas { width: 100%; height: 100%; image-rendering: pixelated; }
.slot .count { position: absolute; bottom: 1px; right: 2px; color: #fff; font-size: 9px; font-weight: bold; text-shadow: 1px 1px 0 #000; }
.health { position: fixed; top: 6px; right: 6px; background: rgba(0,0,0,0.6); color: #fff; padding: 4px 8px; border: 1px solid #444; border-radius: 6px; z-index: 10; font-family: monospace; font-size: 10px; }
#controls { position: fixed; bottom: 50px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 8px; z-index: 12; pointer-events: none; }
.ctrl-group { display: flex; gap: 4px; }
.ctrl-btn { width: 52px; height: 52px; background: rgba(30,30,30,0.65); border: 2px solid #555; border-radius: 10px; color: #fff; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; pointer-events: auto; user-select: none; -webkit-user-select: none; }
.ctrl-btn:active { background: rgba(255,255,255,0.25); transform: scale(0.95); }
#crafting { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(20,20,20,0.96); color: #fff; padding: 14px; border: 3px solid #555; z-index: 20; text-align: center; font-family: monospace; }
.craft-grid { display: grid; grid-template-columns: repeat(2,40px); gap: 4px; margin: 8px auto; width: fit-content; }
.craft-slot { width: 40px; height: 40px; border: 2px solid #666; background: #111; }
.craft-slot canvas, #result canvas { width: 100%; height: 100%; image-rendering: pixelated; }
#result { margin: 8px auto; width: 40px; height: 40px; border: 2px solid #aa0; background: #222; position: relative; }
.inv-list { max-height: 140px; overflow-y: auto; text-align: left; margin-top: 8px; font-size: 11px; }
button { margin: 4px; padding: 6px 12px; background: #444; color: #fff; border: 1px solid #666; cursor: pointer; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <h2>Daddy & Jozef</h2>
  <p>◀▶ Move &nbsp; ▲ Jump</p>
  <p>⛏ Mine &nbsp; 🧱 Place</p>
  <p>👥 Switch Player</p>
</div>
<div class="health" id="health">Loading...</div>
<div class="hotbar" id="hotbar"></div>
<div id="controls">
  <div class="ctrl-group">
    <div class="ctrl-btn" id="btn-left">◀</div>
    <div class="ctrl-btn" id="btn-right">▶</div>
  </div>
  <div class="ctrl-group">
    <div class="ctrl-btn" id="btn-jump">▲</div>
    <div class="ctrl-btn" id="btn-mine">⛏</div>
    <div class="ctrl-btn" id="btn-place">🧱</div>
    <div class="ctrl-btn" id="btn-switch">👥</div>
  </div>
</div>
<div id="crafting">
  <h3>Inventory</h3>
  <p id="craft-player">Active: Daddy</p>
  <div class="craft-grid" id="craft-grid"></div>
  <div id="result"><canvas id="result-canvas" width="32" height="32"></canvas><div class="count" id="result-count"></div></div>
  <button onclick="craftItem()">Craft</button>
  <button onclick="smeltItem()">Smelt</button>
  <button onclick="closeCrafting()">Close</button>
  <div class="inv-list" id="inv-list"></div>
</div>

</script>
</body>
</html>
