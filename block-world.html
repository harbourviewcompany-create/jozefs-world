<style>
#coop-panel{display:none;position:fixed;inset:0;background:#061c28f2;z-index:50;place-items:center;padding:16px}
#coop-panel.open{display:grid}
#coop-card{width:min(420px,100%);background:#0f3841;border:2px solid #7fe4be88;border-radius:20px;padding:24px 18px;text-align:center;color:#eefff2;font-family:system-ui;box-shadow:0 16px 50px #000c}
#coop-card h3{margin:0 0 6px;font-size:24px}
#coop-card .hint{font-size:15px;line-height:1.45;color:#c8e8da;margin:0 0 16px}
#coop-card .big-row{display:grid;gap:14px;margin:0 0 12px}
#coop-card button{padding:18px 14px;border-radius:16px;border:2px solid #83e5d6;background:#183d49;color:#fff;font-weight:900;font-size:18px;cursor:pointer;min-height:56px}
#coop-card button.jozef{background:#2a8f55;border-color:#9dffb8;font-size:22px;padding:22px 14px;box-shadow:0 6px 0 #145a35}
#coop-card button.daddy{background:#1f4f7a;border-color:#8ec8ff;font-size:17px}
#coop-card button.secondary{background:#1a4558;font-size:14px;font-weight:700;min-height:44px;padding:12px}
#coop-card button:disabled{opacity:.4}
#coop-status{margin-top:12px;font-size:16px;color:#d6ff7f;min-height:1.5em;font-weight:700}
#coop-status.ok{color:#9dffb8}
#coop-status.err{color:#ffb4a8}
#coop-code,#coop-diagnostics,#coop-certify,#coop-certify-export,#coop-certify-status{display:none!important}
#jozef-loading{display:none}
