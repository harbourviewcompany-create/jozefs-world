<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07151b"><title>Our Photos | Jozef's World</title><style>
*{box-sizing:border-box}body{margin:0;background:#07151b;color:#f5fafc;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:18px 14px 45px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}a{color:#baff79;text-decoration:none}h1{font-size:clamp(30px,7vw,48px);margin:24px 0 6px}p{color:#b7c9d0;line-height:1.45}.card{background:#122631;border:1px solid #35515b;border-radius:20px;padding:16px;margin:15px 0}button,.pick{border:0;border-radius:13px;background:#baff79;color:#0a1a20;font-weight:800;padding:13px 16px;min-height:46px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}button.secondary,.pick.secondary{background:#29434d;color:#fff}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions>*{flex:1}input[type=file]{position:absolute;width:1px;height:1px;opacity:0}textarea{width:100%;border:1px solid #64808b;border-radius:12px;padding:12px;color:white;background:#081b25;font:inherit;resize:vertical;margin:12px 0}#gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.photo{background:#132b36;border-radius:15px;overflow:hidden;border:1px solid #34515c}.photo img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}.photo-body{padding:10px}.photo-body p{font-size:13px;margin:5px 0;overflow-wrap:anywhere}.photo-body small{color:#a5bdc5}.photo-actions{display:flex;gap:6px;margin-top:9px}.photo-actions button{flex:1;font-size:12px;min-height:40px;padding:8px}.empty{text-align:center;padding:35px 15px;background:#122631;border-radius:16px}#preview{width:100%;max-height:270px;object-fit:contain;border-radius:12px;display:none;background:#081b25}#status{color:#baff79;min-height:22px;font-size:13px}small{color:#b2c7cf} @media(min-width:650px){#gallery{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:400px){.actions>*{flex-basis:100%}}
.family-links{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}.family-links a{white-space:nowrap;font-size:14px}@media(max-width:400px){header strong{font-size:12px}.family-links a{font-size:12px}}  .comment-panel{padding:10px;border-top:1px solid #34515c}.comment-list{max-height:180px;overflow:auto}.comment-list p{font-size:13px;margin:7px 0}.comment-form{display:flex;gap:6px}.comment-form input{min-width:0;flex:1;border-radius:9px;padding:10px;background:#081b25;color:#fff;border:1px solid #64808b}.comment-form button{padding:9px;min-height:38px}.photo img{cursor:zoom-in} .photo img:focus{outline:3px solid #baff79} </style></head><body><main><header><strong>JOZEF'S WORLD / OUR PHOTOS</strong><nav class="family-links"><a href="family-video.html">Video Chat</a> <a href="./">← HQ</a></nav></header><h1>Our Moments</h1><p>Take pictures, add memories and build a photo album together.</p><section class="card" id="cloud-login" hidden aria-label="Family cloud sign in"><h2>Private family cloud</h2><p id="cloud-status">Sign in with your family email to access shared photos.</p><label for="cloud-email">Email address</label><input id="cloud-email" type="email" autocomplete="email" placeholder="you@example.com" style="width:100%;padding:12px;border-radius:12px;background:#081b25;color:white;border:1px solid #64808b;margin:8px 0"><div class="actions"><button id="cloud-send" type="button">Send sign-in link</button><button id="cloud-signout" class="secondary" type="button" hidden>Sign out</button></div><div id="cloud-code-wrap" hidden><label for="cloud-code">Email verification code</label><input id="cloud-code" inputmode="numeric" autocomplete="one-time-code" placeholder="Enter 6-digit code" maxlength="8" style="width:100%;padding:12px;border-radius:12px;background:#081b25;color:white;border:1px solid #64808b;margin:8px 0"><button id="cloud-verify" type="button">Verify and sign in</button></div></section><section class="card" id="photo-composer" aria-label="Add a photo" hidden><div class="actions"><label class="pick" for="camera">Take a photo</label><input id="camera" type="file" accept="image/*" capture="user"><label class="pick secondary" for="upload">Choose a photo</label><input id="upload" type="file" accept="image/*"></div><img id="preview" alt="Photo selected for posting"><textarea id="caption" rows="2" maxlength="240" placeholder="Write something about this moment…"></textarea><div class="actions"><button id="post" disabled>Post to album</button><button class="secondary" id="cancel" type="button">Clear</button></div><p id="status" role="status" aria-live="polite"></p></section><section aria-label="Photo album"><h2>Our photo album</h2><p id="album-note"><small>Sign in and verify your family membership to view the private shared album.</small></p><div class="actions" id="album-tools" hidden><button id="export-album" class="secondary" type="button">Export photo archive</button><button id="import-local" class="secondary" type="button">Move device photos to cloud</button></div><div id="gallery"></div></section></main><script src="family-cloud-config.js"></script><script src="family-photos.js?v=4"></script><script type="module" src="family-cloud.js?v=3"></script></body></html>
