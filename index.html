<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jozef's World</title>
  <meta name="theme-color" content="#101d42" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <style>
    body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#e8f8f5;color:#2c3e50}
    .box{text-align:center;padding:2rem}
  </style>
</head>
<body>
  <div class="box">
    <div style="font-size:3rem">⚽</div>
    <p><strong>Loading Jozef's World…</strong></p>
  </div>
  <script src="site-part1.js"></script>
  <script src="site-part2.js"></script>
  <script src="site-part3.js"></script>
  <script>
    (function () {
      var html = (window.__JW_PART1__ || '') + (window.__JW_PART2__ || '') + (window.__JW_PART3__ || '');
      if (html.indexOf('<!DOCTYPE') === 0 || html.indexOf('<html') !== -1) {
        document.open();
        document.write(html);
        document.close();
      } else {
        document.querySelector('.box').innerHTML = '<p>Clubhouse files are still uploading. Please refresh in a moment.</p>';
      }
    })();
  </script>
</body>
</html>
