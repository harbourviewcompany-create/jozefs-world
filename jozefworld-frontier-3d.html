<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081b28"><title>JozefWorld 3D Explorer</title><style>*{box-sizing:border-box}body{margin:0;background:#081b28;color:#eff7e9;font:14px system-ui}header{position:absolute;top:env(safe-area-inset-top);left:0;right:0;z-index:3;padding:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}header>*{pointer-events:auto}h1{margin:0;font-size:19px;color:#ffe0a1}a{color:#c2f2e5;background:#173b4dcc;padding:9px;border-radius:9px}#scene{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:absolute;top:70px;left:12px;right:12px;max-width:420px;background:#0b293bcf;border:1px solid #6b9b8b;border-radius:12px;padding:10px;font-size:12px;z-index:2}#controls{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:12px;display:grid;grid-template-columns:repeat(3,52px);gap:6px;z-index:3}button{color:white;background:#143a51dd;border:1px solid #9fc9bb;border-radius:13px;min-height:49px;font-size:19px;touch-action:none}#controls button:first-child{grid-column:2}#controls button:nth-child(2){grid-column:1}#controls button:nth-child(3){grid-column:2}#controls button:nth-child(4){grid-column:3}#actions{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));right:12px;display:flex;flex-direction:column;gap:8px;z-index:3}#actions button{font-size:12px;padding:10px}#status{position:absolute;bottom:130px;right:12px;max-width:175px;font-size:11px;background:#102e40cc;padding:8px;border-radius:10px}#fallback{display:none;position:absolute;inset:25% 10%;padding:20px;background:#102c40;border-radius:15px;z-index:5}@media(max-width:400px){h1{font-size:16px}#hud{font-size:11px}}</style><style>#hud{max-width:min(350px,calc(100vw - 24px));font-size:11px;padding:8px}#actions button{min-height:42px}#status{bottom:180px;max-width:155px}@media(max-width:420px){#controls{grid-template-columns:repeat(3,44px)}#controls button{min-height:44px}#actions{bottom:calc(15px + env(safe-area-inset-bottom))}}</style></head><body><header><h1>JozefWorld · 3D Explorer</h1><a href="./jozefworld-frontier.html">Back to Frontier</a></header><canvas id="scene" aria-label="Interactive 3D world"></canvas><div id="hud">Loading 3D world…</div><div id="controls"><button data-dir="up" aria-label="Forward">↑</button><button data-dir="left" aria-label="Left">←</button><button data-dir="down" aria-label="Backward">↓</button><button data-dir="right" aria-label="Right">→</button></div><div id="actions"><button id="view">Change camera</button><button id="home">Find settlement</button></div><div id="status">Hold arrows to walk · Drag to rotate · Interact near buildings</div><div id="fallback" role="alert">3D rendering is unavailable on this device or network. <a href="./jozefworld-frontier.html">Continue in 2D Frontier</a>.</div><script>(function(){const panel=document.getElementById("fallback");function show(force){if(force||!window.__jw3dReady)panel.style.display="block"}window.addEventListener("error",()=>show(true),true);window.addEventListener("unhandledrejection",()=>show(true));document.getElementById("scene").addEventListener("webglcontextlost",e=>{e.preventDefault();show(true)});setTimeout(()=>show(false),15000)})();</script><script type="module" src="./jozefworld-frontier-3d.js?v=6"></script></body></html>
