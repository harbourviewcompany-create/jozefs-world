<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081c32"><title>JozefWorld Globe</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 35%,#175a75,#071a30 70%);color:#eafff7;font:16px system-ui;text-align:center;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}main{max-width:620px;margin:auto}h1{margin:24px 0 8px}p{color:#b6dcd8}#jw-planet{width:min(85vw,340px);aspect-ratio:1;margin:25px auto;border-radius:50%;touch-action:none}nav{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}a{display:block;background:#13546c;border:1px solid #6fe7cf;border-radius:15px;color:white;text-decoration:none;padding:16px;font-weight:700}a:last-child{grid-column:1/-1}a:focus-visible{outline:3px solid white}</style></head><body><main><h1>JozefWorld</h1><p>Drag the planet to rotate. Tap a glowing portal to enter an adventure.</p><div id="jw-planet"></div><nav><a data-world-game href="./block-world.html">Block World</a><a data-world-game href="./jozefworld-sports.html">Sports Stadium</a><a data-world-game href="./jozefworld-hub.html">Family Hub</a></nav></main><script>const world=new URLSearchParams(location.search).get('world')||localStorage.getItem('jw-world-code');if(/^[a-f0-9]{32}$/.test(world||'')){localStorage.setItem('jw-world-code',world);document.querySelectorAll('[data-world-game]').forEach(a=>{const u=new URL(a.href);u.searchParams.set('world',world);a.href=u.href})}</script><script src="./jozefworld-globe.js?v=1"></script></body></html>
